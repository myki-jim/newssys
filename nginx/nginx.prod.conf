worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json;

    # Docker 内部 DNS (强制周期性重解析，避免容器重启后缓存旧 IP)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ========================================================================
    # 限流区域
    # ========================================================================
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ========================================================================
    # 日志格式
    # ========================================================================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'upstream=$upstream_addr';

    access_log /var/log/nginx/access.log main;

    # ========================================================================
    # 主服务 (端口 80)
    # ========================================================================

    server {
        listen 80;
        server_name _;

        # 连接限制
        limit_conn conn_limit 100;

        # 健康检查
        location /health {
            access_log off;
            return 200 "OK";
            add_header Content-Type text/plain;
        }

        # 管理面板
        location = /admin {
            root /usr/share/nginx/html;
            try_files /admin.html =404;
        }

        # 访问密码登录页 (无需鉴权)
        location = /auth/login {
            proxy_pass http://backend:8000/auth/login;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # API 代理 (使用变量强制 DNS 重解析，避免容器重启后 502)
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            set $backend_upstream "backend:8000";
            proxy_pass http://$backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # 前端代理
        location / {
            set $frontend_upstream "frontend:80";
            proxy_pass http://$frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ========================================================================
    # CloudCLI (Claude Code UI) - 端口 8080 (需访问密码)
    # ========================================================================
    server {
        listen 8080;
        server_name _;

        # 访问密码门禁
        auth_request /auth;
        error_page 401 = @gate_login;

        # 内部鉴权子请求
        location = /auth {
            internal;
            proxy_pass http://backend:8000/api/v1/auth/check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
        }

        # 未授权跳转登录页
        location @gate_login {
            return 302 http://$host/auth/login?redirect=$scheme://$host:$server_port$request_uri;
        }

        # WebSocket 代理 (Chat + Shell)
        location /ws {
            set $cloudcli_upstream "cloudcli:3001";
            proxy_pass http://$cloudcli_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host:$server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /shell {
            set $cloudcli_upstream "cloudcli:3001";
            proxy_pass http://$cloudcli_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host:$server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # HTTP 代理 (React 应用 + API)
        location / {
            set $cloudcli_upstream "cloudcli:3001";
            proxy_pass http://$cloudcli_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host:$server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }

    # ========================================================================
    # Render Server — 内容展示服务 (端口 8081, 需访问密码)
    # ========================================================================
    server {
        listen 8081;
        server_name _;

        # 访问密码门禁
        auth_request /auth;
        error_page 401 = @gate_login;

        # 内部鉴权子请求
        location = /auth {
            internal;
            proxy_pass http://backend:8000/api/v1/auth/check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
        }

        # 未授权跳转登录页
        location @gate_login {
            return 302 http://$host/auth/login?redirect=$scheme://$host:$server_port$request_uri;
        }

        location / {
            set $render_upstream "render-server:8000";
            proxy_pass http://$render_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host:$server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
