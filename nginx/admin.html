<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>NewsSys 管理面板</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e2e8f0;padding:40px}
h1{font-size:28px;margin-bottom:8px}
.subtitle{color:#94a3b8;margin-bottom:32px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.card{background:#1e293b;border-radius:12px;padding:24px;border:1px solid #334155}
.card h3{font-size:16px;color:#94a3b8;margin-bottom:12px}
.card .value{font-size:32px;font-weight:bold;color:#38bdf8}
.card .detail{font-size:13px;color:#64748b;margin-top:8px}
.online{color:#22c55e}.offline{color:#ef4444}
.api-test{margin-top:32px}
.api-test input{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:12px;border-radius:8px;width:300px;margin-right:12px}
.api-test button{background:#38bdf8;color:#0f172a;border:none;padding:12px 24px;border-radius:8px;cursor:pointer;font-weight:bold}
.api-test pre{background:#1e293b;padding:16px;border-radius:8px;margin-top:12px;max-height:400px;overflow:auto;font-size:13px}
</style>
</head>
<body>
<h1>NewsSys 管理面板</h1>
<p class="subtitle">服务状态 & API 测试 | 3 冗余部署</p>
<div class="grid">
<div class="card"><h3>API 服务 (3副本)</h3><div class="value" id="api-status">检测中...</div><div class="detail">端口 8000 | 负载均衡</div></div>
<div class="card"><h3>前端服务 (3副本)</h3><div class="value online">运行中</div><div class="detail">Nginx 反向代理</div></div>
<div class="card"><h3>数据库</h3><div class="value" id="db-status">检测中...</div><div class="detail">MySQL 8.0</div></div>
<div class="card"><h3>活跃 Worker</h3><div class="value" id="workers-count">检测中...</div><div class="detail" id="workers-types"></div></div>
</div>
<div class="api-test">
<h3>API 测试</h3>
<input type="text" id="api-url" value="/api/v1/health" placeholder="API 路径">
<button onclick="testAPI()">发送请求</button>
<pre id="api-result">点击按钮测试...</pre>
</div>
<script>
async function checkHealth(){
  try{
    let r=await fetch("/api/v1/health");
    let d=await r.json();
    let data=d.data;
    document.getElementById("api-status").innerHTML='<span class="online">健康</span>';
    document.getElementById("db-status").textContent=data.database=="ok"?"正常":"异常";
    document.getElementById("workers-count").textContent=data.active_workers;
    document.getElementById("workers-types").textContent=data.worker_types.join(", ")||"无";
  }catch(e){
    document.getElementById("api-status").innerHTML='<span class="offline">不可用</span>';
  }
}
async function testAPI(){
  let url=document.getElementById("api-url").value;
  try{
    let r=await fetch(url);
    let d=await r.json();
    document.getElementById("api-result").textContent=JSON.stringify(d,null,2);
  }catch(e){
    document.getElementById("api-result").textContent="错误: "+e.message;
  }
}
checkHealth();
</script>
</body>
</html>
